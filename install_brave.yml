---
- name: Deploiement du raccourci Brave sur les Bureaux des utilisateurs
  hosts: all
  become: yes
  tasks:

    # 1. Recuperation des informations des utilisateurs locaux et LDAP via getent
    - name: Recuperer les utilisateurs du systeme
      getent:
        database: passwd

    # 2. Filtrage robuste des utilisateurs humains (UID >= 1000, shell actif)
    - name: Filtrer les utilisateurs reels (UID >= 1000)
      set_fact:
        real_users: >-
          {% set users = [] %}
          {% for username, user_details in ansible_facts.getent_passwd.items() %}
            {# Gestion de la structure de liste plate ou de liste de listes de getent #}
            {% set details = user_details[0] if user_details[0] is iterable and user_details[0] is not string else user_details %}
            {# Filtrage par UID et par Shell valide #}
            {% if details[1] | int >= 1000 and details[5] in ['/bin/bash', '/bin/sh'] and username != 'nobody' %}
              {% do users.append({'name': username, 'home': details[4]}) %}
            {% endif %}
          {% endfor %}
          {{ users }}

    # 3. Creation des repertoires Bureau / Desktop si necessaire
    - name: Assurer l'existence du dossier Bureau (FR et EN)
      file:
        path: "{{ item.0.home }}/{{ item.1 }}"
        state: directory
        owner: "{{ item.0.name }}"
        group: "{{ item.0.name }}"
        mode: '0755'
      with_nested:
        - "{{ real_users }}"
        - ["Desktop", "Bureau"]
      when: item.0.home is directory

    # 4. Copie du raccourci de Brave dans les deux dossiers (FR et EN)
    - name: Copier le raccourci Brave Browser
      copy:
        src: /usr/share/applications/brave-browser.desktop
        dest: "{{ item.0.home }}/{{ item.1 }}/brave-browser.desktop"
        remote_src: yes
        owner: "{{ item.0.name }}"
        group: "{{ item.0.name }}"
        mode: '0755'
      with_nested:
        - "{{ real_users }}"
        - ["Desktop", "Bureau"]
      when: item.0.home is directory
      ignore_errors: yes
