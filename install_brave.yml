---
- name: Deploiement du raccourci Brave sur les Bureaux des utilisateurs
  hosts: all
  become: yes
  tasks:

    # ==========================================
    # PARTIE 1 : POUR LES FUTURS UTILISATEURS (Toutes machines, ex: .105 et .106)
    # ==========================================

    # On prépare le Bureau par défaut dans le dossier "Squelette" de Linux
    - name: Creer le dossier Bureau dans le squelette global (/etc/skel)
      ansible.builtin.file:
        path: "/etc/skel/Bureau"
        state: directory
        mode: '0755'

    - name: Copier le raccourci Brave dans le squelette global (/etc/skel)
      ansible.builtin.copy:
        dest: "/etc/skel/Bureau/brave-browser.desktop"
        mode: '0755'
        content: |
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Brave Web Browser
          Comment=Acces a internet avec Brave
          Exec=/usr/bin/brave-browser %U
          Icon=brave-browser
          Categories=Network;WebBrowser;
          MimeType=text/html;text/xml;application/xhtml+xml;application/vnd.mozilla.xhtml+xml;x-scheme-handler/http;x-scheme-handler/https;
          StartupNotify=true
          StartupWMClass=brave-browser
          Terminal=false

    # ==========================================
    # PARTIE 2 : POUR LES UTILISATEURS DEJA EXISTANTS (ex: .103 et .104)
    # ==========================================

    - name: Lister les dossiers personnels existants dans /home
      ansible.builtin.find:
        paths: /home
        file_type: directory
      register: found_home_dirs

    - name: Assurer l'existence du dossier Bureau (FR) pour les profils existants
      ansible.builtin.file:
        path: "{{ item.path }}/Bureau"
        state: directory
        owner: "{{ item.pw_name }}"
        mode: '0755'
      loop: "{{ found_home_dirs.files }}"
      when: item.pw_name not in ['root', 'nobody']

    - name: Copier le raccourci Brave Browser (FR) pour les profils existants
      ansible.builtin.copy:
        dest: "{{ item.path }}/Bureau/brave-browser.desktop"
        owner: "{{ item.pw_name }}"
        mode: '0755'
        content: |
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Brave Web Browser
          Comment=Acces a internet avec Brave
          Exec=/usr/bin/brave-browser %U
          Icon=brave-browser
          Categories=Network;WebBrowser;
          MimeType=text/html;text/xml;application/xhtml+xml;application/vnd.mozilla.xhtml+xml;x-scheme-handler/http;x-scheme-handler/https;
          StartupNotify=true
          StartupWMClass=brave-browser
          Terminal=false
      loop: "{{ found_home_dirs.files }}"
      when: item.pw_name not in ['root', 'nobody']
      ignore_errors: yes
