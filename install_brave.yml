---
- name: Deploiement automatise du navigateur Brave avec raccourci Desktop
  hosts: all
  become: true

  tasks:
    - name: Installation des dependances requises (curl)
      apt:
        name: curl
        state: present
        update_cache: yes

    - name: Telechargement et ajout de la cle GPG officielle de Brave
      get_url:
        url: https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
        dest: /usr/share/keyrings/brave-browser-archive-keyring.gpg
        mode: '0644'

    - name: Ajout du depot officiel Brave Browser dans les sources APT
      apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/brave-browser-archive-keyring.gpg] https://brave-browser-apt-release.s3.brave.com/ stable main"
        state: present
        filename: brave-browser-release

    - name: Mise a jour du cache et installation du paquet brave-browser
      apt:
        name: brave-browser
        state: latest
        update_cache: yes

    - name: Obtenir la liste de tous les utilisateurs
      getent:
        database: passwd
      changed_when: false

    - name: Creer le dossier Desktop et raccourci Brave pour chaque utilisateur
      block:
        - name: Creer le dossier Desktop
          file:
            path: "/home/{{ item.key }}/Desktop"
            state: directory
            owner: "{{ item.key }}"
            group: "{{ item.key }}"
            mode: '0755'
          when: item.value[2] | int >= 1000

        - name: Creer le raccourci Brave sur le Desktop
          copy:
            dest: "/home/{{ item.key }}/Desktop/brave-browser.desktop"
            owner: "{{ item.key }}"
            group: "{{ item.key }}"
            mode: '0755'
            content: |
              [Desktop Entry]
              Version=1.0
              Type=Application
              Name=Brave Web Browser
              Comment=Acces a internet avec Brave
              Exec=/usr/bin/brave-browser %U
              Icon=brave-browser
              Categories=Network;WebBrowser;
              MimeType=text/html;text/xml;application/xhtml+xml;application/vnd.mozilla.xhtml+xml;x-scheme-handler/http;x-scheme-handler/https;
              StartupNotify=true
              StartupWMClass=brave-browser
              Terminal=false
          when: item.value[2] | int >= 1000
      loop: "{{ getent_passwd | dict2items }}"
