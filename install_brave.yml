---
- name: Deploiement automatise du navigateur Brave
  hosts: all
  become: true

  tasks:
    - name: Installation des dependances requises (curl)
      apt:
        name: curl
        state: present
        update_cache: yes

    - name: Telechargement et ajout de la cle GPG officielle de Brave
      get_url:
        url: https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
        dest: /usr/share/keyrings/brave-browser-archive-keyring.gpg
        mode: '0644'

    - name: Ajout du depot officiel Brave Browser dans les sources APT
      apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/brave-browser-archive-keyring.gpg] https://brave-browser-apt-release.s3.brave.com/ stable main"
        state: present
        filename: brave-browser-release

    - name: Mise a jour du cache et installation du paquet brave-browser
      apt:
        name: brave-browser
        state: latest
        update_cache: yes

    - name: Obtenir la liste des utilisateurs avec home directory
      shell: "getent passwd | grep '/home' | cut -d: -f1,6"
      register: users_list
      changed_when: false

    - name: Creer le dossier Desktop pour chaque utilisateur
      file:
        path: "{{ item.split(':')[1] }}/Desktop"
        state: directory
        owner: "{{ item.split(':')[0] }}"
        group: "{{ item.split(':')[0] }}"
        mode: '0755'
      loop: "{{ users_list.stdout_lines }}"
      when: users_list.stdout_lines | length > 0

    - name: Creer le raccourci Brave sur le bureau de chaque utilisateur
      file:
        path: "{{ item.split(':')[1] }}/Desktop/brave-browser.desktop"
        state: touch
        owner: "{{ item.split(':')[0] }}"
        group: "{{ item.split(':')[0] }}"
        mode: '0755'
      loop: "{{ users_list.stdout_lines }}"
      when: users_list.stdout_lines | length > 0

    - name: Remplir le fichier .desktop avec le contenu correct
      lineinfile:
        path: "{{ item.split(':')[1] }}/Desktop/brave-browser.desktop"
        line: "{{ line }}"
        create: yes
        owner: "{{ item.split(':')[0] }}"
        group: "{{ item.split(':')[0] }}"
        mode: '0755'
      loop: "{{ users_list.stdout_lines }}"
      when: users_list.stdout_lines | length > 0
      vars:
        lines:
          - '[Desktop Entry]'
          - 'Version=1.0'
          - 'Type=Application'
          - 'Name=Brave Browser'
          - 'Comment=Accedez a Internet avec Brave'
          - 'Exec=/usr/bin/brave-browser %U'
          - 'Icon=brave-browser'
          - 'Terminal=false'
          - 'Categories=Network;WebBrowser;'
          - 'MimeType=text/html;text/xml;application/xhtml+xml;x-scheme-handler/http;x-scheme-handler/https;'
          - 'StartupNotify=true'
      with_items: "{{ lines }}"

    - name: Copier le fichier .desktop officiel de Brave vers le bureau
      copy:
        src: /usr/share/applications/brave-browser.desktop
        dest: "{{ item.split(':')[1] }}/Desktop/brave-browser.desktop"
        remote_src: yes
        owner: "{{ item.split(':')[0] }}"
        group: "{{ item.split(':')[0] }}"
        mode: '0755'
      loop: "{{ users_list.stdout_lines }}"
      when: users_list.stdout_lines | length > 0
      ignore_errors: yes
