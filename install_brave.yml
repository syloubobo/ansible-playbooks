---
- name: Deploiement du raccourci Brave sur les Bureaux des utilisateurs
  hosts: all
  become: yes
  tasks:

    # 1. On lise les dossiers presents dans /home
    - name: Lister les dossiers personnels dans /home
      ansible.builtin.find:
        paths: /home
        file_type: directory
      register: found_home_dirs

    # 2. On cree le dossier Bureau (version FR) - Sans forcer le groupe pour eviter les bugs
    - name: Assurer l'existence du dossier Bureau (FR)
      ansible.builtin.file:
        path: "{{ item.path }}/Bureau"
        state: directory
        owner: "{{ item.pw_name }}"
        mode: '0755'
      loop: "{{ found_home_dirs.files }}"
      when: item.pw_name not in ['root', 'nobody']

    # 3. On copie le raccourci Brave dans le Bureau FR
    - name: Copier le raccourci Brave Browser (FR)
      ansible.builtin.copy:
        dest: "{{ item.path }}/Bureau/brave-browser.desktop"
        owner: "{{ item.pw_name }}"
        mode: '0755'
        content: |
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Brave Web Browser
          Comment=Acces a internet avec Brave
          Exec=/usr/bin/brave-browser %U
          Icon=brave-browser
          Categories=Network;WebBrowser;
          MimeType=text/html;text/xml;application/xhtml+xml;application/vnd.mozilla.xhtml+xml;x-scheme-handler/http;x-scheme-handler/https;
          StartupNotify=true
          StartupWMClass=brave-browser
          Terminal=false
      loop: "{{ found_home_dirs.files }}"
      when: item.pw_name not in ['root', 'nobody']
      ignore_errors: yes

    # 4. On fait la meme chose pour le dossier Desktop (version EN)
    - name: Assurer l'existence du dossier Desktop (EN)
      ansible.builtin.file:
        path: "{{ item.path }}/Desktop"
        state: directory
        owner: "{{ item.pw_name }}"
        mode: '0755'
      loop: "{{ found_home_dirs.files }}"
      when: item.pw_name not in ['root', 'nobody']

    - name: Copier le raccourci Brave Browser (EN)
      ansible.builtin.copy:
        dest: "{{ item.path }}/Desktop/brave-browser.desktop"
        owner: "{{ item.pw_name }}"
        mode: '0755'
        content: |
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Brave Web Browser
          Comment=Acces a internet avec Brave
          Exec=/usr/bin/brave-browser %U
          Icon=brave-browser
          Categories=Network;WebBrowser;
          MimeType=text/html;text/xml;application/xhtml+xml;application/vnd.mozilla.xhtml+xml;x-scheme-handler/http;x-scheme-handler/https;
          StartupNotify=true
          StartupWMClass=brave-browser
          Terminal=false
      loop: "{{ found_home_dirs.files }}"
      when: item.pw_name not in ['root', 'nobody']
      ignore_errors: yes
