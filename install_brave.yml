---
- name: Deploiement automatise du navigateur Brave avec raccourci Desktop
  hosts: all
  become: true

  tasks:
    - name: Installation des dependances requises (curl)
      apt:
        name: curl
        state: present
        update_cache: yes

    - name: Telechargement et ajout de la cle GPG officielle de Brave
      get_url:
        url: https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
        dest: /usr/share/keyrings/brave-browser-archive-keyring.gpg
        mode: '0644'

    - name: Ajout du depot officiel Brave Browser dans les sources APT
      apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/brave-browser-archive-keyring.gpg] https://brave-browser-apt-release.s3.brave.com/ stable main"
        state: present
        filename: brave-browser-release

    - name: Mise a jour du cache et installation du paquet brave-browser
      apt:
        name: brave-browser
        state: latest
        update_cache: yes

    - name: Obtenir la liste de tous les utilisateurs
      getent:
        database: passwd
      changed_when: false

    - name: Debug - Afficher les donnees utilisateur
      debug:
        msg: "Utilisateurs system: {{ getent_passwd | dict2items | map(attribute='key') | list }}"

    - name: Trouver les utilisateurs avec UID >= 1000
      set_fact:
        regular_users: "{{ getent_passwd | dict2items | selectattr('value.2 | int', '>=', 1000) | map(attribute='key') | list }}"

    - name: Debug - Afficher les utilisateurs reguliers
      debug:
        msg: "Utilisateurs reguliers detectes: {{ regular_users }}"

    - name: Creer le dossier Desktop pour chaque utilisateur non-systeme
      file:
        path: "/home/{{ item }}/Desktop"
        state: directory
        owner: "{{ item }}"
        group: "{{ item }}"
        mode: '0755'
      loop: "{{ regular_users }}"
      when: regular_users | length > 0

    - name: Creer le raccourci Brave sur le Desktop de chaque utilisateur
      copy:
        dest: "/home/{{ item }}/Desktop/brave-browser.desktop"
        owner: "{{ item }}"
        group: "{{ item }}"
        mode: '0755'
        content: |
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Brave Web Browser
          Comment=Acces a internet avec Brave
          Exec=/usr/bin/brave-browser %U
          Icon=brave-browser
          Categories=Network;WebBrowser;
          MimeType=text/html;text/xml;application/xhtml+xml;application/vnd.mozilla.xhtml+xml;x-scheme-handler/http;x-scheme-handler/https;
          StartupNotify=true
          StartupWMClass=brave-browser
          Terminal=false
      loop: "{{ regular_users }}"
      when: regular_users | length > 0
