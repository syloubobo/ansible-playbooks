---
- name: Nettoyage complet et réinstallation standard de Veyon
  hosts: all
  become: yes
  gather_facts: no

  tasks:
    - name: Nettoyage forcé de tous les paquets Veyon existants ou cassés
      apt:
        name:
          - veyon
          - veyon-service
          - veyon-plugins
          - libveyon-core
        state: absent
        purge: yes
      ignore_errors: yes # Permet de continuer si un paquet n'était pas là

    - name: Suppression du PPA Veyon incompatible (Zena/Ubuntu)
      apt_repository:
        repo: 'ppa:veyon/stable'
        state: absent
        update_cache: yes
      ignore_errors: yes

    - name: Correction des dépendances cassées éventuelles (dpkg --configure)
      command: dpkg --configure -a
      changed_when: false

    - name: Mise à jour finale du cache APT
      apt:
        update_cache: yes

    - name: Installation propre de Veyon (Version stable de la distribution)
      apt:
        name: veyon
        state: present
