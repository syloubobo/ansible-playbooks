---
- name: Réinstallation propre de Veyon (Version Récente)
  hosts: all
  become: yes
  gather_facts: no

  tasks:
    - name: Installation du paquet prérequis pour les dépôts tiers
      apt:
        name: software-properties-common
        state: present

    - name: Ajout du dépôt officiel PPA de Veyon
      apt_repository:
        repo: 'ppa:veyon/stable'
        state: present
        update_cache: yes

    - name: Installation complète de Veyon
      apt:
        name: veyon
        state: latest
        update_cache: yes
