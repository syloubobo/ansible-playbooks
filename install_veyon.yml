---
- name: Installation adaptative de Veyon Client
  hosts: all
  become: yes
  gather_facts: no

  tasks:
    - name: Mise à jour du cache APT
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Tentative d'installation du paquet Veyon global
      apt:
        name: veyon
        state: present
      register: install_veyon_global
      ignore_errors: yes # Si le paquet n'existe pas (comme sur .103/.105), on ne bloque pas le script

    - name: Installation de Veyon-Service (Solution de repli si veyon n'existe pas)
      apt:
        name: veyon-service
        state: present
      when: install_veyon_global.failed # S'exécute uniquement sur les PC où la première tâche a échoué
