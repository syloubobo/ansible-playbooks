---
- name: Installation brute de Veyon Client
  hosts: all
  become: yes
  gather_facts: no # Désactivé pour accélérer l'exécution

  tasks:
    - name: Mise à jour du cache apt
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Suppression de l'ancien paquet veyon si présent (anti-conflit)
      apt:
        name: veyon
        state: absent
        purge: yes

    - name: Installation de Veyon Service
      apt:
        name: veyon-service
        state: present
