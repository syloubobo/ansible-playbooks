---
- name: Deploiement automatise de GeoGebra avec gestion de cle GPG
  hosts: all
  become: true

  tasks:
    - name: Telechargement de la cle GPG officielle GeoGebra (Format ASCII)
      get_url:
        url: https://download.geogebra.org/downloads/geogebra-key.gpg
        dest: /tmp/geogebra-key.gpg
        mode: '0644'

    - name: Conversion et installation de la cle pour APT
      shell: "gpg --dearmor < /tmp/geogebra-key.gpg > /usr/share/keyrings/geogebra-keyring.gpg"
      args:
        creates: /usr/share/keyrings/geogebra-keyring.gpg

    - name: Ajout du depot officiel GeoGebra associe a la cle
      apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/geogebra-keyring.gpg] http://vps.geogebra.org/deb/ stable main"
        state: present
        filename: geogebra

    - name: Nettoyage de la cle temporaire
      file:
        path: /tmp/geogebra-key.gpg
        state: absent

    - name: Mise a jour du cache et installation de GeoGebra 6
      apt:
        name: geogebra6
        state: latest
        update_cache: yes
