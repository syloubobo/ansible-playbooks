---
- name: Deploiement automatise de GeoGebra via depot officiel
  hosts: all
  become: true

  tasks:
    - name: Telechargement et ajout de la cle GPG officielle de GeoGebra
      get_url:
        url: https://download.geogebra.org/downloads/geogebra-key.gpg
        dest: /usr/share/keyrings/geogebra-keyring.gpg
        mode: '0644'

    - name: Ajout du depot officiel GeoGebra dans les sources APT
      apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/geogebra-keyring.gpg] http://vps.geogebra.org/deb/ stable main"
        state: present
        filename: geogebra

    - name: Mise a jour du cache et installation de GeoGebra 6
      apt:
        name: geogebra6
        state: latest
        update_cache: yes
