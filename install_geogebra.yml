---
- name: Deploiement automatise de GeoGebra Educatif (Version 5)
  hosts: all
  become: true

  tasks:
    - name: Installer les dependances requises
      ansible.builtin.apt:
        name:
          - default-jre
          - wget
          - unzip
        state: present
        update_cache: yes

    - name: Telechargement de GeoGebra 5 Educatif (Linux Portable)
      ansible.builtin.get_url:
        url: https://download.geogebra.org/package/linux-port
        dest: /tmp/geogebra5.zip
        mode: '0644'
        validate_certs: true
      register: download_result
      ignore_errors: yes

    - name: Extraction de l'archive GeoGebra
      ansible.builtin.unarchive:
        src: /tmp/geogebra5.zip
        dest: /opt/
        remote_src: yes
      when: download_result is succeeded

    - name: Lister le contenu de /opt apres extraction
      ansible.builtin.shell: ls -la /opt/ | grep -i geogebra
      register: opt_content
      when: download_result is succeeded
      changed_when: false
      ignore_errors: yes

    - name: Afficher le contenu trouve
      ansible.builtin.debug:
        var: opt_content.stdout_lines
      when: download_result is succeeded

    - name: Chercher tous les fichiers geogebra
      ansible.builtin.shell: find /opt -name "*geogebra*" -type f 2>/dev/null
      register: geogebra_files
      when: download_result is succeeded
      changed_when: false

    - name: Afficher tous les fichiers geogebra trouves
      ansible.builtin.debug:
        var: geogebra_files.stdout_lines
      when: download_result is succeeded

    - name: Chercher l'executable GeoGebra (geogebra ou GeoGebra)
      ansible.builtin.shell: find /opt -name "geogebra" -o -name "GeoGebra" 2>/dev/null | grep -E "bin|GeoGebra" | head -1
      register: geogebra_path
      when: download_result is succeeded
      changed_when: false

    - name: Creation du lien symbolique pour acces facile
      ansible.builtin.file:
        src: "{{ geogebra_path.stdout }}"
        dest: /usr/local/bin/geogebra
        state: link
        force: yes
      when: 
        - download_result is succeeded
        - geogebra_path.stdout | length > 0
      register: link_result

    - name: Afficher le resultat du lien
      ansible.builtin.debug:
        var: link_result
      when: download_result is succeeded

    - name: Nettoyage du fichier temporaire
      ansible.builtin.file:
        path: /tmp/geogebra5.zip
        state: absent
