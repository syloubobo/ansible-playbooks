---
- name: Installation de Google Earth Pro
  hosts: all
  gather_facts: yes
  tasks:
    - name: Téléchargement du paquet .deb de Google Earth
      get_url:
        url: https://dl.google.com/dl/linux/direct/google-earth-pro-stable_current_amd64.deb
        dest: /tmp/google-earth-pro-stable_current_amd64.deb
        mode: '0644'

    - name: Installation du paquet avec apt
      apt:
        deb: /tmp/google-earth-pro-stable_current_amd64.deb
        state: present
        update_cache: yes
